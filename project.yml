name: BookReader
options:
  bundleIdPrefix: com.bookreader
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

packages:
  SQLite.swift:
    url: https://github.com/stephencelis/SQLite.swift.git
    from: "0.14.1"
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: "0.9.18"
  SwiftEdgeTTS:
    url: https://github.com/herrkaefer/SwiftEdgeTTS.git
    from: "1.0.0"

targets:
  BookReader:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Packages/SherpaOnnx/Sources/SherpaOnnx
      - path: Resources
        excludes:
          - "Models/**"   # 排除，不随包分发（用下面的方式按模型分发）
      - path: Resources/Models/kokoro-zh
        buildPhase: resources
        type: folder
        excludes:
          - "kokoro-multi-lang-v1_0/**"
          - "kokoro-multi-lang-v1_1/**"
      - path: Resources/Models/matcha-zh
        buildPhase: resources
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zxcstc123.bookreader
        INFOPLIST_KEY_CFBundleIdentifier: com.zxcstc123.bookreader
        INFOPLIST_KEY_CFBundleDisplayName: "书阅读"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) SHERPA_ONNX_ENABLED
        SHERPA_SLICE[sdk=iphonesimulator*]: ios-arm64_x86_64-simulator
        SHERPA_SLICE[sdk=iphoneos*]: ios-arm64
        HEADER_SEARCH_PATHS: $(inherited) $(SRCROOT)/Packages/SherpaOnnx/Frameworks/onnxruntime.xcframework/$(SHERPA_SLICE)/Headers
        OTHER_LDFLAGS: $(inherited) -lc++ -force_load $(SRCROOT)/Packages/SherpaOnnx/Frameworks/onnxruntime.xcframework/$(SHERPA_SLICE)/libonnxruntime.a
    dependencies:
      - package: SQLite.swift
        product: SQLite
      - package: ZIPFoundation
        product: ZIPFoundation
      - package: SwiftEdgeTTS
        product: SwiftEdgeTTS
      - framework: Packages/SherpaOnnx/Frameworks/sherpa-onnx.xcframework
        embed: false

schemes:
  BookReader:
    build:
      targets:
        BookReader: all
    run:
      config: Debug
    archive:
      config: Release